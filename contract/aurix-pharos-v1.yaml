openapi: 3.1.0
info:
  title: AURIX–Pharos Protocol
  version: 1.0.0-draft.1
  summary: Device-initiated protocol between AURIX edge cameras and the Pharos server.
  description: |
    Source of truth for v1. The companion document `aurix-pharos-integration.md`
    explains behaviour; this file defines the wire format. If they disagree, fix
    whichever is wrong and bump `info.version`.

    Owner: Pharos project. Changes are proposed by either side and accepted by
    Pharos.

    Conventions
    - All timestamps are integer epoch milliseconds, UTC, unless a field says
      otherwise (`excludedDates` and schedule times are camera-local, see
      `site.timeZone`).
    - The device always initiates. Pharos never calls the device.
    - Unknown JSON properties are ignored by both sides (forward compatibility).
      Schemas therefore allow additional properties except where noted.
    - Items marked `x-status: proposed` were added while writing this file and
      are not yet in the integration document. Pharos accepts or rejects them
      before 1.0.0.
servers:
  - url: https://{host}/aurix/v1
    variables:
      host:
        default: pharos.site.local
security:
  - deviceToken: []

tags:
  - name: Device
    description: Handshake, status, configuration and commands
  - name: Identity
    description: People and access policies
  - name: Events
    description: Sightings, access decisions and device events
  - name: Media
    description: Enrollment photos and event images

paths:
  /hello:
    post:
      tags: [Device]
      operationId: hello
      summary: Handshake. Called on start, after reconnect, and after any 401.
      parameters:
        - $ref: '#/components/parameters/DeviceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HelloRequest' }
      responses:
        '200':
          description: Device accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HelloResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Revoked' }
        '426': { $ref: '#/components/responses/ProtocolMismatch' }
        '429': { $ref: '#/components/responses/Backoff' }
        '503': { $ref: '#/components/responses/Backoff' }

  /devices/{deviceId}/status:
    post:
      tags: [Device]
      operationId: postStatus
      summary: Report device state. The reply carries desired configuration and pending commands.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusRequest' }
      responses:
        '200':
          description: Desired configuration (always complete) and pending commands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Revoked' }
        '429': { $ref: '#/components/responses/Backoff' }
        '503': { $ref: '#/components/responses/Backoff' }

  /devices/{deviceId}/sync/state:
    get:
      tags: [Identity]
      operationId: getSyncState
      summary: Cheap change check, polled every `sync.intervalMs`.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceHeader'
      responses:
        '200':
          description: Current revisions for this device's view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Revoked' }
        '429': { $ref: '#/components/responses/Backoff' }
        '503': { $ref: '#/components/responses/Backoff' }

  /devices/{deviceId}/sync/policies:
    get:
      tags: [Identity]
      operationId: getPolicies
      summary: All access policies relevant to this device. Always complete.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceHeader'
      responses:
        '200':
          description: Full policy set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PoliciesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Revoked' }
        '429': { $ref: '#/components/responses/Backoff' }
        '503': { $ref: '#/components/responses/Backoff' }

  /devices/{deviceId}/sync/people:
    get:
      tags: [Identity]
      operationId: getPeople
      summary: Delta (with `since`) or full (without) people sync, cursor-paged.
      description: |
        Full sync (no `since`) returns every person this device must hold;
        anyone not returned must be removed — but only after every page has
        arrived and the count equals `total`. Any failure discards the staged
        set. Pharos returns 503 rather than a short list if it cannot enumerate
        everyone.

        All pages of one sync are pinned to `snapshotRevision`. Pass the
        `cursor` from the previous page unchanged; do not repeat `since` on
        subsequent pages (Pharos ignores it if present).
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceHeader'
        - name: since
          in: query
          required: false
          description: Device's stored revision. Omit for a full sync.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: cursor
          in: query
          required: false
          description: Opaque `nextCursor` from the previous page.
          schema: { type: string, maxLength: 2048 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeoplePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/SnapshotExpired' }
        '410': { $ref: '#/components/responses/Revoked' }
        '429': { $ref: '#/components/responses/Backoff' }
        '503': { $ref: '#/components/responses/Backoff' }

  /devices/{deviceId}/sync/deletions:
    get:
      tags: [Identity]
      operationId: getDeletions
      summary: People removed from this device's view after `since`. Delta sync only.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceHeader'
        - name: since
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Deletions (possibly empty).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/SnapshotExpired' }
        '410': { $ref: '#/components/responses/Revoked' }
        '429': { $ref: '#/components/responses/Backoff' }
        '503': { $ref: '#/components/responses/Backoff' }

  /people/{personId}/photos/{photoId}:
    get:
      tags: [Media]
      operationId: getPhoto
      summary: Enrollment photo. Re-download only when the person record's `sha256` changes.
      parameters:
        - name: personId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PersonId' }
        - name: photoId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PhotoId' }
        - $ref: '#/components/parameters/DeviceHeader'
      responses:
        '200':
          description: JPEG bytes. The device verifies them against `sha256`.
          headers:
            ETag:
              description: Quoted sha256 hex of the body.
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, contentMediaType: image/jpeg }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Revoked' }
        '429': { $ref: '#/components/responses/Backoff' }
        '503': { $ref: '#/components/responses/Backoff' }

  /events/{eventId}:
    put:
      tags: [Events]
      operationId: putEvent
      summary: Create or update an event. Idempotent; ordered by `revision`.
      description: |
        Pharos stores the body only if `revision` is greater than the stored
        revision for this `eventId`. A stale or duplicate PUT still returns 200
        with `applied: false` — it is not an error and must not be retried.
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/EventId' }
        - $ref: '#/components/parameters/DeviceHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
      responses:
        '200':
          description: Accepted (applied or ignored as stale).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventAck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Revoked' }
        '429': { $ref: '#/components/responses/Backoff' }
        '503': { $ref: '#/components/responses/Backoff' }

  /events/{eventId}/images/{imageKind}:
    put:
      tags: [Media]
      operationId: putEventImage
      summary: Upload or replace an event image. Send after the first event PUT.
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/EventId' }
        - name: imageKind
          in: path
          required: true
          schema: { type: string, enum: [face, scene] }
        - $ref: '#/components/parameters/DeviceHeader'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, contentMediaType: image/jpeg }
      responses:
        '204': { description: Stored. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            Event not yet known (error code `event_unknown`). The device PUTs
            the event first, then retries the image. During offline replay
            this means the event is still queued behind.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410': { $ref: '#/components/responses/Revoked' }
        '413':
          description: Image too large (error code `image_too_large`). Limit is 2 MiB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/Backoff' }
        '503': { $ref: '#/components/responses/Backoff' }

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: Device token issued once at commissioning. Bound to `X-AURIX-Device`.

  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: Must equal the `X-AURIX-Device` header, otherwise 401.
      schema: { $ref: '#/components/schemas/DeviceId' }
    DeviceHeader:
      name: X-AURIX-Device
      in: header
      required: true
      schema: { $ref: '#/components/schemas/DeviceId' }

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 1 }

  responses:
    BadRequest:
      description: Malformed request. Device logs and drops it; it is a bug, not a retry case.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Token missing, wrong, or not bound to this device id. Stop; retry /hello every 60 s.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SnapshotExpired:
      description: Sync snapshot expired (`snapshot_expired`). Restart this sync from the first page.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Revoked:
      description: Device revoked (`device_revoked`). Stop all traffic.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProtocolMismatch:
      description: Protocol version not supported (`protocol_unsupported`). Retry hourly.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Backoff:
      description: Busy or unavailable. Wait `Retry-After`, else exponential backoff 1–60 s with jitter.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- scalars ----------
    DeviceId:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    PersonId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._-]+$'
    PhotoId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._-]+$'
    PolicyId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._-]+$'
    EventId:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
    CommandId:
      type: string
      minLength: 1
      maxLength: 64
    EpochMs:
      type: integer
      format: int64
      minimum: 0
    Revision:
      type: integer
      format: int64
      minimum: 0
    Watchlist:
      type: string
      enum: [no_concern, concern, threat]
      description: Display as "No concern", "Concern", "Threat".
    Sha256Hex:
      type: string
      pattern: '^[0-9a-f]{64}$'
    LocalTime:
      type: string
      description: Camera-local wall time, HH:MM, 00:00–24:00.
      pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$'
    LocalDate:
      type: string
      format: date
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Machine-readable. Known values: bad_request, unauthorized,
                device_revoked, protocol_unsupported, snapshot_expired,
                not_found, event_unknown, image_too_large, busy, unavailable.
            message: { type: string }

    # ---------- handshake ----------
    HelloRequest:
      type: object
      required: [deviceId, protocol, software, platform, capabilities]
      properties:
        deviceId: { $ref: '#/components/schemas/DeviceId' }
        protocol: { type: integer, const: 1 }
        software:
          type: object
          required: [name, version]
          properties:
            name: { type: string, const: AURIX }
            version: { type: string, minLength: 1, maxLength: 64 }
            modelVersion: { type: string, maxLength: 128 }
        platform:
          type: object
          required: [vendor, model, serial]
          properties:
            vendor: { type: string, enum: [axis, hanwha, other] }
            model: { type: string, maxLength: 128 }
            serial: { type: string, maxLength: 128 }
            firmware: { type: string, maxLength: 128 }
            ip:
              type: string
              description: Device's own address as it sees it. Pharos uses it to join the device to the camera row.
              x-status: proposed
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            description: Known values listed; unknown values are ignored.
            examples: [face-recognition, watchlist, access-decision, scene-images, relay-output, liveness]

    HelloResponse:
      type: object
      required: [accepted, protocol, serverTime, statusIntervalMs, endpoints]
      properties:
        accepted: { type: boolean, const: true }
        protocol: { type: integer, const: 1 }
        serverTime: { $ref: '#/components/schemas/EpochMs' }
        statusIntervalMs: { type: integer, minimum: 500, maximum: 60000 }
        endpoints:
          type: object
          required: [base]
          properties:
            base: { type: string, format: uri }

    # ---------- configuration ----------
    Config:
      type: object
      description: |
        Desired (from Pharos) or effective (from device) configuration. Flat
        dotted keys. A key Pharos omits means "device default". Unknown keys are
        never an error: the device lists them in `unsupportedConfig`.
      properties:
        site.zones:
          type: array
          items: { type: string, minLength: 1, maxLength: 128 }
          uniqueItems: true
        site.timeZone:
          type: string
          description: IANA zone used to evaluate schedules and excludedDates. If absent, the camera's own zone.
          examples: [America/Los_Angeles]
          x-status: proposed
        reporting.mode: { type: string, enum: [watchlist, enrolled, all] }
        reporting.strangers: { type: boolean }
        reporting.noConcernSightings: { type: boolean }
        reporting.unrecognizable: { type: boolean }
        recognition.matchThreshold: { type: number, minimum: 0, maximum: 1 }
        recognition.minFaceSizePx: { type: integer, minimum: 1 }
        recognition.liveness: { type: boolean }
        events.trackCloseSec: { type: integer, minimum: 1, maximum: 600 }
        events.sceneImages: { type: boolean }
        sync.intervalMs: { type: integer, minimum: 500 }
        sync.keepAllPeople: { type: boolean }
        sync.maxDeltaAgeSec: { type: integer, minimum: 0 }
        sync.downloadPhotos: { type: boolean }
        access.reportDecisions: { type: boolean }
        relay.enabled: { type: boolean }
        relay.pulseMs: { type: integer, minimum: 100, maximum: 10000 }
        device.localUiEnabled: { type: boolean }
      additionalProperties: true

    # ---------- status ----------
    StatusRequest:
      type: object
      required: [time, appliedConfigRevision, appliedConfig, sync, queue, health]
      properties:
        time: { $ref: '#/components/schemas/EpochMs' }
        appliedConfigRevision:
          type: integer
          minimum: 0
          description: 0 before any configuration has been received.
        appliedConfig: { $ref: '#/components/schemas/Config' }
        rejectedConfig:
          type: array
          items:
            type: object
            required: [key, reason]
            properties:
              key: { type: string }
              reason: { type: string }
        unsupportedConfig:
          type: array
          uniqueItems: true
          items: { type: string }
        sync:
          type: object
          required: [revision, people, templatesReady, templatesFailed]
          properties:
            revision: { $ref: '#/components/schemas/Revision' }
            policiesRevision: { $ref: '#/components/schemas/Revision' }
            people: { type: integer, minimum: 0 }
            templatesReady: { type: integer, minimum: 0 }
            templatesFailed: { type: integer, minimum: 0 }
            inProgress:
              type: string
              enum: [none, delta, full]
              x-status: proposed
            lastSuccessAt: { oneOf: [ { $ref: '#/components/schemas/EpochMs' }, { type: 'null' } ] }
            lastError: { type: [string, 'null'] }
        queue:
          type: object
          required: [eventsPending, imagesPending]
          properties:
            eventsPending: { type: integer, minimum: 0 }
            imagesPending: { type: integer, minimum: 0 }
            oldestPendingAt: { oneOf: [ { $ref: '#/components/schemas/EpochMs' }, { type: 'null' } ] }
            dropped:
              type: integer
              minimum: 0
              description: Items dropped from the bounded queue since boot.
              x-status: proposed
        health:
          type: object
          properties:
            cpuPct: { type: number, minimum: 0, maximum: 100 }
            tempC: { type: number }
            fps: { type: number, minimum: 0 }
            clockDriftMs: { type: integer }
            streams:
              type: array
              items:
                type: object
                required: [id, ok]
                properties:
                  id: { type: string }
                  ok: { type: boolean }
        commandResults:
          type: array
          items: { $ref: '#/components/schemas/CommandResult' }

    StatusResponse:
      type: object
      required: [configRevision, config, commands, nextStatusInMs]
      properties:
        configRevision: { type: integer, minimum: 1 }
        config: { $ref: '#/components/schemas/Config' }
        commands:
          type: array
          items: { $ref: '#/components/schemas/Command' }
        nextStatusInMs: { type: integer, minimum: 500, maximum: 60000 }

    # ---------- commands ----------
    Command:
      type: object
      required: [commandId, type]
      description: Executed exactly once per commandId; result reported in the next status.
      properties:
        commandId: { $ref: '#/components/schemas/CommandId' }
        type: { type: string }
        args: { type: object }
      oneOf:
        - properties:
            type: { const: resync }
        - properties:
            type: { const: captureScene }
            args:
              type: object
              properties:
                streamId: { type: string, default: main }
        - properties:
            type: { const: relayPulse }
            args:
              type: object
              properties:
                ms: { type: integer, minimum: 100, maximum: 10000 }
                reason: { type: string }
                operator: { type: string }
        - properties:
            type: { const: reenroll }
            args:
              type: object
              properties:
                personIds:
                  type: array
                  description: Empty or absent means everyone.
                  items: { $ref: '#/components/schemas/PersonId' }
        - description: Unknown command type. Device reports status `unsupported`.
          properties:
            type:
              not: { enum: [resync, captureScene, relayPulse, reenroll] }

    CommandResult:
      type: object
      required: [commandId, status]
      properties:
        commandId: { $ref: '#/components/schemas/CommandId' }
        status: { type: string, enum: [done, failed, unsupported] }
        detail: { type: [string, 'null'] }

    # ---------- identity ----------
    SyncState:
      type: object
      required: [revision, policiesRevision]
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        policiesRevision: { $ref: '#/components/schemas/Revision' }

    Policy:
      type: object
      required: [policyId, name, banned, allZonesAllTimes, rules]
      properties:
        policyId: { $ref: '#/components/schemas/PolicyId' }
        name: { type: string, maxLength: 256 }
        banned: { type: boolean }
        allZonesAllTimes: { type: boolean }
        rules:
          type: array
          items:
            type: object
            required: [zones, schedule]
            properties:
              zones:
                type: array
                minItems: 1
                items: { type: string, minLength: 1, maxLength: 128 }
              schedule:
                type: array
                description: |
                  Each entry is one same-day window, start < end. A window
                  crossing midnight is sent as two entries.
                items:
                  type: object
                  required: [days, start, end]
                  properties:
                    days:
                      type: array
                      minItems: 1
                      uniqueItems: true
                      items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
                    start: { $ref: '#/components/schemas/LocalTime' }
                    end: { $ref: '#/components/schemas/LocalTime' }
              excludedDates:
                type: array
                uniqueItems: true
                items: { $ref: '#/components/schemas/LocalDate' }

    PoliciesResponse:
      type: object
      required: [revision, policies]
      properties:
        revision: { $ref: '#/components/schemas/Revision' }
        policies:
          type: array
          items: { $ref: '#/components/schemas/Policy' }

    Photo:
      type: object
      required: [photoId, sha256, kind, updatedAt]
      properties:
        photoId: { $ref: '#/components/schemas/PhotoId' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        kind: { type: string, enum: [face, face-masked] }
        updatedAt: { $ref: '#/components/schemas/EpochMs' }

    Person:
      type: object
      required: [personId, revision, displayName, watchlist, policyIds, photos]
      properties:
        personId: { $ref: '#/components/schemas/PersonId' }
        revision: { $ref: '#/components/schemas/Revision' }
        externalRef: { type: [string, 'null'], maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 256 }
        firstName: { type: [string, 'null'], maxLength: 128 }
        lastName: { type: [string, 'null'], maxLength: 128 }
        personType:
          type: string
          description: Passed through. Known values listed; others allowed.
          examples: [employee, contractor, visitor, watchlist-only]
        watchlist: { $ref: '#/components/schemas/Watchlist' }
        policyIds:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/PolicyId' }
        validFrom:
          description: Epoch ms. Null means no lower bound. (Doc example used ISO 8601; changed for consistency.)
          oneOf: [ { $ref: '#/components/schemas/EpochMs' }, { type: 'null' } ]
          x-status: proposed
        validUntil:
          description: Epoch ms. Null means no upper bound.
          oneOf: [ { $ref: '#/components/schemas/EpochMs' }, { type: 'null' } ]
          x-status: proposed
        photos:
          type: array
          items: { $ref: '#/components/schemas/Photo' }

    PeoplePage:
      type: object
      required: [snapshotRevision, people, nextCursor, total]
      properties:
        snapshotRevision: { $ref: '#/components/schemas/Revision' }
        people:
          type: array
          items: { $ref: '#/components/schemas/Person' }
        nextCursor: { type: [string, 'null'] }
        total:
          type: integer
          minimum: 0
          description: Total people in this sync (all pages). Full sync is applied only if the received count equals this.

    DeletionsResponse:
      type: object
      required: [snapshotRevision, deleted]
      properties:
        snapshotRevision: { $ref: '#/components/schemas/Revision' }
        deleted:
          type: array
          items:
            type: object
            required: [personId, revision]
            properties:
              personId: { $ref: '#/components/schemas/PersonId' }
              revision: { $ref: '#/components/schemas/Revision' }

    # ---------- events ----------
    Event:
      type: object
      required: [eventId, revision, deviceId, kind, startedAt, updatedAt]
      properties:
        eventId: { $ref: '#/components/schemas/EventId' }
        revision: { type: integer, minimum: 1 }
        deviceId: { $ref: '#/components/schemas/DeviceId' }
        streamId: { type: string, default: main }
        kind: { type: string, enum: [sighting, access, relay, snapshot, device] }
        startedAt: { $ref: '#/components/schemas/EpochMs' }
        updatedAt: { $ref: '#/components/schemas/EpochMs' }
        endedAt: { oneOf: [ { $ref: '#/components/schemas/EpochMs' }, { type: 'null' } ] }
        zone: { type: [string, 'null'] }
        person:
          description: Null for strangers and unrecognizable faces.
          oneOf:
            - type: 'null'
            - type: object
              required: [personId, watchlist]
              properties:
                personId: { $ref: '#/components/schemas/PersonId' }
                displayName: { type: string }
                watchlist: { $ref: '#/components/schemas/Watchlist' }
        stranger: { type: boolean }
        unrecognizable:
          type: boolean
          description: Face too poor to match (reported only under `reporting.unrecognizable` or mode `all`).
          x-status: proposed
        match:
          type: object
          properties:
            score: { type: number, minimum: 0, maximum: 1 }
            threshold: { type: number, minimum: 0, maximum: 1 }
            modelVersion: { type: string }
        liveness:
          type: object
          properties:
            checked: { type: boolean }
            passed: { type: [boolean, 'null'] }
            score: { type: [number, 'null'], minimum: 0, maximum: 1 }
        access:
          type: object
          required: [evaluated]
          properties:
            evaluated: { type: boolean }
            decision: { type: [string, 'null'], enum: [granted, denied, null] }
            reason:
              type: [string, 'null']
              description: Known values listed; others allowed.
              examples: [policy, watchlist, banned, schedule, zone, excluded_date, validity, liveness, no_policy, stranger]
            policyId: { oneOf: [ { $ref: '#/components/schemas/PolicyId' }, { type: 'null' } ] }
        face:
          type: object
          properties:
            quality: { type: number, minimum: 0, maximum: 1 }
            yawDeg: { type: number }
            pitchDeg: { type: number }
            sizePx: { type: integer, minimum: 0 }
        images:
          type: object
          description: Which images the device has uploaded or will upload for this event.
          properties:
            face: { type: boolean }
            scene: { type: boolean }
        relay:
          description: Present when kind = relay.
          x-status: proposed
          type: object
          required: [ms]
          properties:
            ms: { type: integer, minimum: 100, maximum: 10000 }
            trigger: { type: string, enum: [command, access] }
            commandId: { oneOf: [ { $ref: '#/components/schemas/CommandId' }, { type: 'null' } ] }
            operator: { type: [string, 'null'] }
            reason: { type: [string, 'null'] }
        commandId:
          description: For kind = snapshot, the captureScene command that caused it.
          x-status: proposed
          oneOf: [ { $ref: '#/components/schemas/CommandId' }, { type: 'null' } ]
        device:
          description: Present when kind = device.
          x-status: proposed
          type: object
          required: [type]
          properties:
            type:
              type: string
              examples: [stream_lost, stream_restored, tamper, storage_error, clock_drift, queue_overflow]
            detail: { type: [string, 'null'] }
      allOf:
        - if: { properties: { kind: { const: access } } }
          then:
            required: [access]
            properties:
              access:
                required: [evaluated, decision]
                properties:
                  evaluated: { const: true }
                  decision: { enum: [granted, denied] }
        - if: { properties: { kind: { const: relay } } }
          then: { required: [relay] }
        - if: { properties: { kind: { const: device } } }
          then: { required: [device] }
        - if:
            properties: { person: { type: object } }
            required: [person]
          then:
            properties: { stranger: { const: false } }

    EventAck:
      type: object
      required: [eventId, applied, storedRevision]
      properties:
        eventId: { $ref: '#/components/schemas/EventId' }
        applied: { type: boolean, description: False when the PUT was stale or a duplicate. }
        storedRevision: { type: integer, minimum: 1 }
