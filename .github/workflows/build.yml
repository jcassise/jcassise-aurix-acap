name: build-acap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Converts YuNet to per-tensor INT8 TFLite at build time so weights never live in git.
  # Research weights (WIDER FACE): INTERNAL BENCHMARK ONLY.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-models.txt
      - run: pip install -r tools/requirements-models.txt
      - name: Convert YuNet
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: python3 tools/convert_yunet.py --out models-out
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models-out/
          retention-days: 7

  build:
    needs: models
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # AXIS P3248-LV, ARTPEC-7, AXIS OS 11.11 LTS (no 12.x for this model).
          # VERIFY: pick the newest ACAP Native SDK tag whose minimum AXIS OS is <= 11.11.
          - name: p3248-artpec7
            arch: armv7hf
            sdk_image: axisecp/acap-native-sdk:1.15-armv7hf-ubuntu22.04
          # AXIS P3267-LV, ARTPEC-8, AXIS OS 12.11 LTS.
          # VERIFY: SDK tag matching AXIS OS 12.11.
          - name: p3267-artpec8
            arch: aarch64
            sdk_image: axisecp/acap-native-sdk:12.0.0-aarch64-ubuntu24.04
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: models
          path: app/models/

      - name: Build ACAP
        run: docker build --build-arg SDK_IMAGE=${{ matrix.sdk_image }} -t aurix-${{ matrix.arch }} .

      - name: Extract .eap
        run: |
          mkdir -p build
          id=$(docker create aurix-${{ matrix.arch }})
          docker cp "$id":/opt/app ./build/app
          docker rm "$id"
          ls -la build/app/*.eap

      - uses: actions/upload-artifact@v4
        with:
          name: aurix-${{ matrix.name }}
          path: build/app/*.eap

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C tests run
