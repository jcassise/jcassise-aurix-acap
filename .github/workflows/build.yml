name: build-acap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels a run still in progress (no pile-up of identical builds).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Converts the models at build time so weights never live in git.
  # Research weights (YuNet: WIDER FACE, MobileFaceNet: MS-Celeb-1M): INTERNAL BENCHMARK ONLY.
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-models.txt
      - run: pip install -r tools/requirements-models.txt
      - name: Convert YuNet (detector)
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: python3 tools/convert_yunet.py --out models-out
      - name: Convert MobileFaceNet (embedder, DLPU + CPU variants)
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: python3 tools/convert_mobilefacenet.py --out models-out
      - uses: actions/upload-artifact@v4
        with:
          name: models
          path: models-out/
          retention-days: 7

  build:
    needs: models
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # AXIS P3248-LV, ARTPEC-7, AXIS OS 11.11 LTS (no 12.x for this model).
          # SDK 1.15 = last SDK for AXIS OS 11.x (matches Axis examples tag v1.15).
          - name: p3248-artpec7
            arch: armv7hf
            sdk_image: axisecp/acap-native-sdk:1.15-armv7hf-ubuntu22.04
          # AXIS P3267-LV, ARTPEC-8, AXIS OS 12.11 LTS.
          # SDK 12.11.0 matches AXIS OS 12.11 (Axis examples tag 12.11.0).
          - name: p3267-artpec8
            arch: aarch64
            sdk_image: axisecp/acap-native-sdk:12.11.0-aarch64-ubuntu24.04
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: models
          path: app/models/

      - name: Build ACAP
        run: docker build --build-arg SDK_IMAGE=${{ matrix.sdk_image }} --build-arg ARCH=${{ matrix.arch }} -t aurix-${{ matrix.arch }} .

      - name: Extract .eap
        run: |
          mkdir -p build
          id=$(docker create aurix-${{ matrix.arch }})
          docker cp "$id":/opt/app ./build/app
          docker rm "$id"
          ls -la build/app/*.eap

      - uses: actions/upload-artifact@v4
        with:
          name: aurix-${{ matrix.name }}
          path: build/app/*.eap

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev libjansson-dev libcairo2-dev
      - run: make -C tests run
      - run: sh tests/overlay/run.sh

  pharos-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjansson-dev libssl-dev libglib2.0-dev
      - run: pip install jsonschema cryptography openapi-spec-validator pyyaml pillow
      - name: Contract package is consistent
        run: python3 contract/tools/build_and_check.py
      - name: Protocol and identity-sync scenarios
        run: make -C tests/pharos run
      - name: Same suites under AddressSanitizer / UBSan
        run: make -C tests/pharos asan

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libfcgi-dev libfcgi-bin libjansson-dev libcurl4-openssl-dev libssl-dev
      - run: cd tests/web && npm install --no-audit --no-fund
      - name: Dashboard end-to-end (FastCGI endpoint + page in jsdom)
        run: tests/web/run.sh

  # Pull requests: build the release metadata exactly as a release would (dry run), so problems show early.
  release-preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aurix-*
          path: eaps
      - name: Release metadata (dry run)
        run: |
          v=$(python3 -c "import json;print(json.load(open('app/manifest.json.aarch64'))['acapPackageConf']['setup']['version'])")
          python3 tools/release_meta.py --eaps eaps --repo "$GITHUB_REPOSITORY" --tag "v$v" --out release-out
      - uses: actions/upload-artifact@v4
        with:
          name: release-preview
          path: release-out/
          retention-days: 7

  # Push to main with a new version in the manifests -> once everything passes, CI creates the tag and
  # publishes the release itself. Same version as an existing release -> nothing is published.
  # Pharos polls: https://github.com/<owner>/<repo>/releases/latest/download/latest.json
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, host-tests, pharos-protocol, dashboard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version, and whether it is already released
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import json;print(json.load(open('app/manifest.json.aarch64'))['acapPackageConf']['setup']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$v is already released - nothing to publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "v$v is new - publishing"
          fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          pattern: aurix-*
          path: eaps
      - name: Release metadata
        if: steps.ver.outputs.new == 'true'
        run: python3 tools/release_meta.py --eaps eaps --repo "$GITHUB_REPOSITORY" --tag "v${{ steps.ver.outputs.version }}" --out release-out
      - name: Tag and publish the GitHub release
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "v$v" release-out/* --target "$GITHUB_SHA" \
            --title "AURIX $v" \
            --notes "Packages for armv7hf (ARTPEC-7) and aarch64 (ARTPEC-8). Unsigned development build: installs on AXIS OS 11 and 12, not 13. Pharos reads latest.json and aurix-compat.json."
